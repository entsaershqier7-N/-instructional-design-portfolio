<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Recovery Lab</title><link rel="stylesheet" href="../assets/style.css"></head><body>
<header><nav><strong>Service Recovery Lab</strong><a href="index.html">Case Study</a></nav></header><main class="wrap course"><div class="eyebrow">Branching scenario prototype</div><h1>A customer is already frustrated. What do you do next?</h1>
<div class="progress"><span id="bar"></span></div><div id="screen" class="card"></div></main>
<script>
const s=[
{q:'Customer: “I’ve contacted support twice and nobody fixed this. I was charged again.”',o:[['You need to calm down before I can help.',0],['I can see why this is frustrating. Let me confirm what happened so I can help.',1],['That problem was caused by another agent.',0]],good:'Strong start. You acknowledged the experience and moved toward fact-finding.',bad:'That response may increase friction or deflect responsibility.'},
{q:'You see two similar charges. What should you do before promising a refund?',o:[['Verify dates, amounts, account details, and prior case notes.',1],['Promise a refund immediately.',0],['Transfer the customer without reviewing anything.',0]],good:'Correct. Verify the facts before committing to a remedy.',bad:'A premature promise or transfer can create a second service failure.'},
{q:'The issue is confirmed, and the approved remedy is within your authority. What next?',o:[['Explain the remedy, ownership, and expected timing.',1],['Say “it should be fine” and end the interaction.',0],['Escalate automatically.',0]],good:'Correct. A clear next step reduces uncertainty and repeat contacts.',bad:'The customer needs a specific, owned next step.'},
{q:'When should you escalate?',o:[['Whenever the customer sounds upset.',0],['When the issue exceeds your authority or meets defined risk/exception criteria.',1],['Every time a customer asks twice.',0]],good:'Correct. Escalation should be criteria-based.',bad:'Escalation is not a substitute for normal service recovery.'}
];let i=0,score=0;
function r(){document.getElementById('bar').style.width=(i/s.length*100)+'%';if(i>=s.length){document.getElementById('screen').innerHTML=`<h2>Scenario complete</h2><div class="kpi">${score}/4</div><p>${score>=3?'You demonstrated strong service-recovery judgment.':'Review the A-C-R-C-E job aid and try the scenario again.'}</p><a class="btn" href="job-aid.html">Open Job Aid</a> <button class="btn secondary" onclick="location.reload()">Try Again</button>`;return}let x=s[i],h=`<h2>Decision ${i+1}</h2><p>${x.q}</p>`;x.o.forEach(a=>h+=`<button class="option" onclick="p(${a[1]})">${a[0]}</button>`);h+='<div id="fb" class="feedback"></div>';document.getElementById('screen').innerHTML=h}
function p(ok){let f=document.getElementById('fb');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?s[i].good:s[i].bad;if(ok)score++;setTimeout(()=>{i++;r()},1200)}r();
</script></body></html>
